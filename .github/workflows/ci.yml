# Validates that the committed index and the multiverse API actually work,
# on every change: formatting first, then `nix flake check`, which runs the
# checks defined in flake.nix —
#
#   checks.index        — pure assertions over the committed JSON, no network
#   checks.flake-at     — flakeAt's flake shape; fetches three trees at eval
#   checks.installables — the exact-match CLI keys (releases, commits, labels)
#   checks.compose      — the headline claim end to end: three Pythons from
#                         three revisions composed into one buildEnv, built
#                         for real (contents substitute from cache.nixos.org)
#   checks.site         — tests/site/*.spec.js in a real browser against
#                         `nix build .#site`. The only impure check: the page
#                         imports Preact from a CDN, so it needs the network
#                         while it runs, which is why the sandbox is relaxed
#                         below. `nix run .#test-site` does the same locally
#                         without touching nix.conf.
#
# update-index.yml keeps the index fresh; this workflow keeps it honest.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Both Linux systems the store-path artifacts are published for. A store
    # path belongs to one system, so the fast path is now per-system data and
    # the only way to know it holds on aarch64-linux is to evaluate it there.
    #
    # The aarch64 runner takes the eval checks only: compose builds three
    # historical Pythons for real, and the site check drives a browser, neither
    # of which is a claim about this architecture that the x86_64 job does not
    # already make.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
            full: true
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
            full: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          # `sandbox = relaxed` is what lets checks.site run: it marks itself
          # __noChroot to reach the CDN the page imports Preact from, and Nix
          # refuses to build such a derivation under a strict sandbox. It
          # relaxes nothing for any other check — the setting only takes effect
          # on derivations that ask for it by name.
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            sandbox = relaxed

      # What this saves is the tool wrappers and their closure, which every run
      # would otherwise rebuild. It does not cache the revisions themselves:
      # those arrive through builtins.fetchTree and `nix flake prefetch`, which
      # fetch at evaluation time and never consult a substituter.
      - uses: cachix/cachix-action@v17
        with:
          name: nixpkgs-multiverse
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Formatting
        if: matrix.full
        run: nix fmt -- --ci

      - name: Tests
        if: matrix.full
        run: nix flake check -L

      # The evaluation checks, named rather than swept, because `nix flake
      # check` would also pull in the two this runner is deliberately not
      # asked for.
      - name: Tests (evaluation only)
        if: ${{ !matrix.full }}
        run: |
          nix build -L --no-link \
            .#checks.${{ matrix.system }}.index \
            .#checks.${{ matrix.system }}.canonical \
            .#checks.${{ matrix.system }}.history \
            .#checks.${{ matrix.system }}.installables \
            .#checks.${{ matrix.system }}.module \
            .#checks.${{ matrix.system }}.minimize \
            .#checks.${{ matrix.system }}.lock \
            .#checks.${{ matrix.system }}.flake-at \
            .#checks.${{ matrix.system }}.fast

      # `mvs`'s own suite, which flake check cannot run in full: the differential
      # test holds the version comparator against `builtins.compareVersions`
      # over 4000 real pairs from the index, and that needs a `nix` to ask —
      # inside the build sandbox there is none, so it skips there. Everything
      # downstream of that comparator is only as trustworthy as this step.
      - name: mvs
        run: nix develop .#mvs -c cargo test --manifest-path mvs/Cargo.toml
