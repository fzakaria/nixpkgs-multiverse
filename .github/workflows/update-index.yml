# Keeps revisions.json and index/versions.json current with the nixos-unstable
# channel archive, and commits whatever moved.
#
# The whole job is incremental. fetch-unstable-revisions.sh only looks up
# channels it has never seen, build-index.sh --incremental only evaluates
# offsets past the index's revisionCount, and neither needs a nixpkgs clone:
# revisions are resolved through the GitHub API and materialised with
# `nix flake prefetch`. A run that finds nothing new costs about a minute.
#
# When the channel moved, the run also advances the store-path artifacts:
# state is restored from the rolling release, update-outpaths runs its
# incremental match-and-crawl, the rolling assets are re-published, and once
# a day the changed artifacts are copied to a dated release tag with
# data-pins.json repointed at them. No bump, no cut, no pin churn.
name: update-index

on:
  schedule:
    # nixos-unstable advances a handful of times a day, so hourly already tracks
    # it closely and most runs will still find nothing. GitHub queues scheduled
    # workflows and drops them under load, so treat this as a ceiling on
    # frequency, not a promise of one.
    - cron: "0 * * * *"
  workflow_dispatch:

# Runs push to the default branch and can take several minutes when a new
# revision lands, which is longer than the gap between two schedules.
concurrency:
  group: update-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The branch tip as of now, not the commit that triggered the run. A run
      # queued behind another by the concurrency group above starts minutes or
      # tens of minutes after it was created, by which time the run it waited
      # for has pushed — and checking out the triggering SHA would build on a
      # main that no longer exists, so the push below could not fast-forward.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      # What this saves is the tool wrappers and their closure, which every run
      # would otherwise rebuild. It does not cache the revisions themselves:
      # those arrive through builtins.fetchTree and `nix flake prefetch`, which
      # fetch at evaluation time and never consult a substituter.
      #
      # pushFilter keeps the index-derived data out. The site, its data trees,
      # the database and the fetched release artifacts get new hashes with
      # every index commit, are ~250 MB per run compressed, and are never
      # substituted again once the next commit lands — they grew this cache to
      # 13 GiB. A filtered path still gets pushed if a pushed path's closure
      # holds it, so the wrappers that embed one (test-site, serve-site, the
      # mvs wrapper around multiverse.db) are named too. No spaces in the
      # regex: the post-build hook passes it to grep unquoted.
      - uses: cachix/cachix-action@v17
        with:
          name: nixpkgs-multiverse
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          pushFilter: '(-(multiverse-data|nixpkgs-multiverse-(site|site-data|store-data)|multiverse\.db|test-site|check-site|serve-site|mvs)|\.json\.gz)$'

      # NIXPKGS is deliberately left unset: with no clone on disk the script
      # resolves new channel revisions through the GitHub API instead, which is
      # a couple of requests rather than a five gigabyte fetch.
      - name: Fetch new unstable revisions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix run .#fetch-unstable-revisions

      # An incremental merge stops at the first revision it could not extract,
      # rather than claiming coverage past it, so a transient failure is retried
      # next run. A revision that fails permanently parks the index just behind
      # it — visible as a "stopping at offset N" line here.
      # Independent of the revision list: releases.json is a small mutable table
      # of channel tips that nothing indexes, so it neither shifts an offset nor
      # waits on an indexing run.
      - name: Follow the release channels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix run .#fetch-releases

      # An incremental merge stops at the first revision it could not extract,
      # rather than claiming coverage past it, and exits non-zero — so a run
      # that half-indexes commits nothing and is simply retried next hour.
      - name: Index whatever is new
        run: nix run .#build-index -- --incremental

      # Must run in this job, not a later one: history is folded from the
      # per-revision extractions the step above just wrote into index/.per-rev,
      # and that directory is gitignored, so it exists only for the life of this
      # runner. Running it here is also what keeps history.json and
      # versions.json covering the same revisions — if the step above fails the
      # workflow stops and neither file advances.
      - name: Fold the new revisions into the version history
        run: nix run .#build-history -- --incremental

      # Reads the two committed files and nothing else, so unlike the step above
      # it does not need the extraction cache — but it runs here anyway, because
      # index/stats.json is aggregated from index/history.json and tests/index.nix
      # fails the build if the two disagree about how many revisions they cover.
      # Every file the commit below touches advances in this job or none does.
      - name: Re-aggregate the chart data
        run: nix run .#build-stats

      - name: Refresh the README status block
        run: nix run .#update-readme-status

      # A backstop, not a formality. README.md is the one file this job writes
      # that a formatter also owns, so a generator whose output drifts from
      # prettier's taste lands a commit here and fails `nix fmt --ci` in the
      # next CI run — a failure in a different workflow, about a file nobody
      # touched. Formatting rather than checking keeps that self-healing; the
      # commit step below adds paths explicitly, so nothing else can ride along.
      - name: Keep the tree formatted
        run: nix fmt

      # The rolling tip file carries the revisionCount it was built against;
      # when it matches the index just updated above, the channel has not
      # moved since the last data run and every data step below is skipped.
      # A missing rolling asset reads as stale, which is what bootstraps.
      - name: Check whether the store-path data is stale
        id: data
        run: |
          current=$(python3 -c 'import json; print(json.load(open("index/versions.json"))["revisionCount"])')
          rolling=$(curl -fsSL https://github.com/fzakaria/nixpkgs-multiverse/releases/download/data-rolling/tip-outpaths-x86_64-linux.json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["revisionCount"])' || echo 0)
          echo "index covers $current revisions; rolling data covers $rolling"
          if [ "$current" != "$rolling" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

      # Previous artifacts and crawl graph from the rolling release, pinned
      # graph shards as the consolidation fallback — a fresh runner starts
      # warm. See tools/restore-outpaths-state.sh.
      - name: Restore the outpaths state
        if: steps.data.outputs.stale == 'true'
        run: bash tools/restore-outpaths-state.sh

      # Fetch the new bump's listing, evaluate the new revisions for every
      # published system, join the two into exact per-system digests, crawl the
      # newly resolved digests and their frontier, consolidate. Every step is
      # incremental: the evaluation covers the new bumps only, and the join
      # carries every older pair over from the previous cut.
      #
      # The listing names no darwin path, so darwin rides entirely on the
      # join's --probe-cache. See tools/update-outpaths.sh.
      - name: Update the store-path artifacts
        if: steps.data.outputs.stale == 'true'
        # A standard runner has 4 vCPU and 16 GB, so one worker per core, each
        # recycling at 2.5 GB — 10 GB at peak. Systems are evaluated one after
        # another within a revision, so the third costs time and not memory.
        # The evaluation is the slow half of this job (~6 minutes for two
        # revisions across two systems at two workers) and it is CPU-bound, so
        # the cores are what buys it back. More HTTP concurrency would do
        # nothing here; the crawl already runs at ~3,500 narinfos/s.
        env:
          EVAL_WORKERS: 4
          EVAL_MAXMEM: 2500
        run: nix run .#update-outpaths

      - name: Publish the rolling state
        if: steps.data.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload data-rolling --clobber \
            index/.outpaths/data/outpaths-*.json \
            index/.outpaths/data/tip-outpaths-*.json \
            index/.outpaths/data/outs-*.json \
            index/.outpaths/data/misses-*.json \
            index/.outpaths/graph.jsonl.gz

      # Piggybacked on the first data run of each UTC day: shard by closing
      # period, upload whatever differs from its pin to a dated tag, and
      # repoint data-pins.json (committed below). Later bumps the same day
      # ride the rolling release until tomorrow's cut.
      - name: Cut the dated data release
        if: steps.data.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="data-$(date -u +%Y%m%d)"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "$TAG already cut; next cut tomorrow"
            exit 0
          fi
          python3 tools/shard-data.py \
            --revisions revisions.json --versions index/versions.json \
            --outpaths index/.outpaths/data/outpaths-*.json index/.outpaths/data/tip-outpaths-*.json \
            --data-dir index/.outpaths/data --out-dir index/.outpaths/data/shards
          bash tools/cut-data-release.sh "$TAG"

      - name: Commit
        run: |
          if git diff --quiet -- revisions.json releases.json index README.md data-pins.json; then
            echo "nothing new"
            exit 0
          fi

          # Name the revision in the message, so the log reads as a history of
          # the channel rather than a wall of identical "update index" commits.
          tip=$(python3 -c 'import json; r = json.load(open("revisions.json"))[-1]; print(r["rev"][:12], r["date"])')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revisions.json releases.json index README.md data-pins.json
          git commit -m "Index nixpkgs through ${tip}"

          # A push can still lose a race against a human, and dropping the
          # commit is not harmless: the assets are already uploaded, and
          # cut-data-release.sh skips a tag it has already cut, so a lost
          # data-pins.json bump would not be regenerated until tomorrow. Rebase
          # onto whatever landed and try once more; a conflict here is a real
          # disagreement about generated files and should fail loudly.
          git push || {
            echo "push rejected; rebasing onto the current tip and retrying"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          }
